name: Competitor Monitor

on:
  schedule:
    - cron: '30 3 * * 0'    # Sunday 9:00 AM IST
  workflow_dispatch:

env:
  YT_API_KEY: ${{ secrets.YT_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/competitor_monitor.py
      - run: |
          git config user.name "Channel Agent"
          git config user.email "agent@channel.local"
          git add -A
          git diff --cached --quiet || (git commit -m "Weekly competitor analysis" && git push)
