name: Competitor Monitor

on:
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client requests
      - name: Monitor Competitors
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python scripts/competitor_monitor.py
      - name: Commit Results
        run: |
          git config user.name "Channel Agent"
          git config user.email "agent@channel.local"
          git add data/competitor_trends.json
          git diff --cached --quiet || git commit -m "Weekly competitor trends update"
          git push
