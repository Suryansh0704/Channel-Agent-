      # ============================================
      # STEP 10: Send Email Report
      # ============================================
      - name: Send Email Report
        shell: python
        run: |
          import os, json, requests
          from pathlib import Path
          from datetime import datetime
          
          API_KEY = os.environ["EMAIL_SERVICE_API_KEY"]
          FROM_ADDR = os.environ["EMAIL_FROM_ADDRESS"]
          TO_ADDR = os.environ["EMAIL_TO_ADDRESS"]
          RUN_NUM = os.environ["RUN_NUMBER"]  # <-- FIX #2: Now this works!
          
          reports = {}
          
          try:
              with open("data/analytics.json", "r") as f:
                  analytics = json.load(f)
              reports["videos"] = analytics.get("total_videos", 0)
              reports["method"] = analytics.get("method_used", "unknown")
              reports["latest_video"] = analytics["videos"][0] if analytics.get("videos") else None
              reports["api_errors"] = analytics.get("api_errors", [])
          except Exception as e:
              reports["videos"] = 0
              reports["analytics_error"] = str(e)
          
          try:
              with open("evolution/history.json", "r") as f:
                  history = json.load(f)
              latest_run = history["runs"][-1] if history.get("runs") else {}
              reports["tier"] = latest_run.get("tier", "UNKNOWN")
              reports["multiplier"] = latest_run.get("multiplier", 1.0)
              reports["changes"] = latest_run.get("changes", [])
          except:
              reports["tier"] = "UNKNOWN"
              reports["changes"] = []
          
          try:
              with open("logs/script_generation.json", "r") as f:
                  sg = json.load(f)
              reports["scripts_generated"] = sg.get("generated", 0)
              reports["script_errors"] = sg.get("errors", [])
          except:
              reports["scripts_generated"] = 0
              reports["script_errors"] = []
          
          try:
              with open("logs/push_results.json", "r") as f:
                  push = json.load(f)
              reports["push_success"] = sum(1 for p in push if p["status"] == "SUCCESS")
              reports["push_fail"] = sum(1 for p in push if p["status"] == "FAIL")
          except:
              reports["push_success"] = 0
              reports["push_fail"] = 0
          
          subject = "Channel Agent Report - Run " + RUN_NUM + " - " + datetime.utcnow().strftime("%Y-%m-%d %H:%M")
          
          body = "CHANNEL AGENT DAILY REPORT\n"
          body += "=" * 60 + "\n\n"
          body += "Run: " + RUN_NUM + "\n"
          body += "Time: " + datetime.utcnow().isoformat() + "\n"
          body += "Evolution Tier: " + reports["tier"] + "\n"
          body += "Multiplier: " + str(reports.get("multiplier", 1.0)) + "\n\n"
          
          body += "YOUTUBE ANALYTICS\n"
          body += "-" * 40 + "\n"
          body += "Method used: " + reports.get("method", "unknown") + "\n"
          body += "Videos collected: " + str(reports["videos"]) + "\n"
          if reports.get("latest_video"):
              lv = reports["latest_video"]
              body += "Latest video: " + lv["title"][:50] + "...\n"
              body += "  Views: " + str(lv["views"]) + " | Likes: " + str(lv["likes"]) + " | Score: " + str(lv["composite_score"]) + "\n"
          if reports.get("api_errors"):
              body += "API Errors: " + str(len(reports["api_errors"])) + "\n"
              for e in reports["api_errors"][:3]:
                  body += "  - " + e + "\n"
          body += "\n"
          
          body += "CONFIG EVOLUTION\n"
          body += "-" * 40 + "\n"
          if reports.get("changes"):
              for c in reports["changes"]:
                  body += "  " + c + "\n"
          else:
              body += "  No changes (insufficient data or DISASTER tier)\n"
          body += "\n"
          
          body += "SCRIPT GENERATION\n"
          body += "-" * 40 + "\n"
          body += "Generated: " + str(reports["scripts_generated"]) + "/3\n"
          if reports.get("script_errors"):
              body += "Errors:\n"
              for e in reports["script_errors"]:
                  body += "  - " + e + "\n"
          body += "\n"
          
          body += "CONFIG PUSH\n"
          body += "-" * 40 + "\n"
          body += "Success: " + str(reports["push_success"]) + " | Failed: " + str(reports["push_fail"]) + "\n\n"
          
          body += "SYSTEM STATUS\n"
          body += "-" * 40 + "\n"
          body += "Health Check: PASSED\n"
          body += "All steps completed.\n"
          body += "\nSee logs/ directory in repo for full details.\n"
          
          payload = {
              "personalizations": [{"to": [{"email": TO_ADDR}]}],
              "from": {"email": FROM_ADDR},
              "subject": subject,
              "content": [{"type": "text/plain", "value": body}]
          }
          
          r = requests.post("https://api.sendgrid.com/v3/mail/send",
              headers={"Authorization": "Bearer " + API_KEY, "Content-Type": "application/json"},
              json=payload, timeout=15)
          
          if r.status_code in [200, 202]:
              print("Email sent to " + TO_ADDR)
              with open("logs/email_status.json", "w") as f:
                  json.dump({"status": "sent", "to": TO_ADDR, "time": datetime.utcnow().isoformat()}, f)
          else:
              print("Email failed: HTTP " + str(r.status_code))
              print("Response: " + str(r.text[:200]))
              Path("logs").mkdir(exist_ok=True)
              with open("logs/email_report_" + datetime.utcnow().strftime("%Y%m%d_%H%M") + ".txt", "w") as f:
                  f.write("To: " + TO_ADDR + "\nSubject: " + subject + "\n\n" + body)
              with open("logs/email_status.json", "w") as f:
                  json.dump({"status": "failed", "code": r.status_code, "response": r.text[:500], "saved_locally": True}, f)
              print("Report saved to logs/email_report_*.txt")

