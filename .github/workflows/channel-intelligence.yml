# ==============================================================
#  MAIN
# ==============================================================

def main():
    print("=" * 62)
    print("  Health Check - Channel Agent")
    print("=" * 62)

    checks = {
        "secrets": check_secrets_present(),
        "github": check_github_access(),
        "youtube_api": check_youtube_api(),
        "youtube_oauth": check_youtube_oauth(),
        "gemini": check_gemini_api(),
        "email": check_email_service(),
        "config_files": check_config_files(),
    }

    print()

    all_pass = True

    for name, result in checks.items():
        status = result.get("status", "FAIL")

        if status == "PASS":
            icon = "PASS"
        elif status == "WARN":
            icon = "WARN"
        else:
            icon = "FAIL"
            all_pass = False

        print(
            f"  {icon} {name.upper().ljust(15)} -> "
            f"{status} | {result.get('message', '')}"
        )

        if "repos" in result:
            for repo in result["repos"]:
                print(f"      {repo}")

    log_data = {
        "overall": "PASS" if all_pass else "FAIL",
        "checks": checks,
    }

    LOG_DIR.mkdir(parents=True, exist_ok=True)

    log_file = LOG_DIR / "health_check.json"

    with log_file.open("w", encoding="utf-8") as f:
        json.dump(log_data, f, indent=2)

    print(f"\n  Log saved: {log_file}")
    print("=" * 62)

    if all_pass:
        print("  PASS ALL CHECKS PASSED - Proceeding")
        sys.exit(0)
    else:
        print("  FAIL HEALTH CHECK FAILED - Aborting workflow")
        sys.exit(1)


if __name__ == "__main__":
    main()
