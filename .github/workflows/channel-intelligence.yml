name: Channel Intelligence

"on":
  workflow_dispatch:
    inputs:
      run_number:
        description: 'Run number (1 or 2)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 12 * * *'

env:
  YT_API_KEY: ${{ secrets.YT_API_KEY }}
  CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
  YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  EMAIL_SERVICE_API_KEY: ${{ secrets.EMAIL_SERVICE_API_KEY }}
  EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
  EMAIL_TO_ADDRESS: ${{ secrets.EMAIL_TO_ADDRESS }}

jobs:
  run-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

      - name: Health Check
        id: health
        run: python scripts/health_check.py

      - name: Collect Analytics
        if: success() && steps.health.outcome == 'success'
        run: python scripts/analytics_collector.py

      - name: Analyze Comments
        if: success() && steps.health.outcome == 'success'
        run: python scripts/comment_analyzer.py

      - name: Evolve Configs
        if: success() && steps.health.outcome == 'success'
        env:
          RUN_NUMBER: ${{ github.event.inputs.run_number || '1' }}
        run: python scripts/evolve_configs.py

      - name: Generate Script Prompt
        if: success() && steps.health.outcome == 'success'
        run: python scripts/generate_script_prompt.py

      - name: Batch Generate Scripts
        if: success() && steps.health.outcome == 'success' && (github.event.schedule == '30 3 * * *' || github.event.inputs.run_number == '1')
        run: python scripts/batch_generator.py

      - name: Push Configs
        if: success() && steps.health.outcome == 'success'
        run: python scripts/push_configs.py

      - name: Cross-Platform Adapt
        if: success() && steps.health.outcome == 'success' && (github.event.schedule == '30 3 * * *' || github.event.inputs.run_number == '1')
        run: python scripts/cross_platform_adapter.py

      - name: Send Email Report
        if: success() && steps.health.outcome == 'success'
        env:
          RUN_NUMBER: ${{ github.event.inputs.run_number || '1' }}
        run: python scripts/send_email_report.py

      - name: Commit History
        if: success() && steps.health.outcome == 'success'
        run: |
          git config user.name "Channel Agent"
          git config user.email "agent@channel.local"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Run ${{ github.run_number }} $(date -u +%Y-%m-%d_%H:%M)"
            git push
          else
            echo "No changes"
          fi
