        if: github.event.schedule == '30 3 * * 0'  # Sunday only
        shell: python
        run: |
          import os, json, requests
          from datetime import datetime
          print("Competitor monitoring would run here on Sundays")
          # Add competitor logic if needed

      # ============================================
      # STEP 8: Push Configs
      # ============================================
      - name: Push Configs
        shell: python
        run: |
          import os, json, base64, requests
          from pathlib import Path
          
          TOKEN = os.environ["PAT_TOKEN"]
          OWNER = os.environ["OWNER"]
          HEADERS = {"Authorization": "Bearer " + TOKEN, "Accept": "application/vnd.github+json"}
          
          REPO_MAP = {
              "Video-generator-": ["video-generator-config.json"],
              "Audio-generator-": ["audio-generator-config.json"],
              "Video-editor-": ["video-editor-config.json"],
              "channel-analyzer": ["uploader-config.json", "script-prompt-config.json"]  # <-- FIX #3
          }
          
          results = []
          
          for repo, files in REPO_MAP.items():
              for filename in files:
                  filepath = "config/" + filename
                  if not Path(filepath).exists():
                      results.append({"file": filename, "repo": repo, "status": "MISSING"})
                      continue
                  
                  with open(filepath, "r") as f:
                      content = f.read()
                  
                  get_r = requests.get(
                      "https://api.github.com/repos/" + OWNER + "/" + repo + "/contents/" + filename + "?ref=main",
                      headers=HEADERS, timeout=10)
                  
                  sha = get_r.json().get("sha") if get_r.status_code == 200 else None
                  
                  payload = {
                      "message": "Auto-update config from Channel Agent",
                      "content": base64.b64encode(content.encode()).decode(),
                      "branch": "main"
                  }
                  if sha:
                      payload["sha"] = sha
                  
                  put_r = requests.put(
                      "https://api.github.com/repos/" + OWNER + "/" + repo + "/contents/" + filename,
                      headers=HEADERS, json=payload, timeout=10)
                  
                  if put_r.status_code in [200, 201]:
                      results.append({"file": filename, "repo": repo, "status": "SUCCESS"})
                      print("Pushed " + filename + " to " + repo)
                  else:
                      error_msg = put_r.json().get("message", "Unknown")
                      results.append({"file": filename, "repo": repo, "status": "FAIL", "code": put_r.status_code, "error": error_msg})
                      print("Failed to push " + filename + " to " + repo + ": " + str(put_r.status_code) + " - " + error_msg)
          
          with open("logs/push_results.json", "w") as f:
              json.dump(results, f, indent=2)

